id = "aw-watcher-odoo"
name = "ActivityWatch watcher (Odoo)"
description = "Tracks the time spent in Zed per Git branch for ActivityWatch, the same way as the Odoo VS Code and web watchers."
version = "0.1.0"
schema_version = 1
authors = ["Abderraouf Ghrissi (abgh) <abgh@odoo.com>"]
repository = "https://github.com/odoo/aw-watcher-vscode"

# Zed starts a language server only for files of the languages it is registered for
[language_servers.aw-watcher-odoo]
name = "ActivityWatch"
languages = [
    "AsciiDoc",
